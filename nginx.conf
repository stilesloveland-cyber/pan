server {
    listen 80;
    server_name localhost;

    root /var/www/html/pan;
    index index.html index.php;

    client_max_body_size 10G;
    client_body_buffer_size 128k;
    client_body_timeout 300s;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    location /protected-uploads {
        internal;
        alias /var/www/uploads;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "upload_max_filesize=10G\npost_max_size=10G\nmax_execution_time=300\nmax_input_time=300";
    }

    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
