<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百度网盘</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 网络延迟显示 -->
    <div class="network-status" id="network-status">
        <i class="fas fa-wifi"></i>
        <span id="ping-value">-- ms</span>
    </div>

    <!-- 登录界面 -->
    <div id="login-container" class="login-container">
        <h1><i class="fas fa-cloud-upload-alt"></i> 网盘登录</h1>
        <form class="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="login-password">密码</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn" style="width: 100%; padding: 12px;">
                <i class="fas fa-sign-in-alt"></i> 登录
            </button>
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <span>还没有账号？</span>
            <button class="btn btn-outline" onclick="showRegisterModal()" style="width: 100%; margin-top: 10px;">
                <i class="fas fa-user-plus"></i> 注册
            </button>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>注册账号</h2>
                <button class="modal-close" onclick="closeRegisterModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="register-password">密码</label>
                        <input type="password" id="register-password" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="confirm-password">确认密码</label>
                        <input type="password" id="confirm-password" required style="width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeRegisterModal()">取消</button>
                        <button type="submit" class="btn">注册</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="main-container" class="container" style="display: none;">
        <div class="main-layout">
            <!-- 侧边栏 -->
            <div class="sidebar">
                <div class="sidebar-section">
                    <h3>文件分区</h3>
                    <ul class="sidebar-menu">
                        <li><a href="#" class="active" data-view="personal"><i class="fas fa-folder"></i> 私人空间</a></li>
                        <li><a href="#" data-view="public"><i class="fas fa-users"></i> 公共空间</a></li>
                    </ul>
                </div>
                <div class="sidebar-section">
                    <h3>使用情况</h3>
                    <div class="space-info-card">
                        <div class="space-info-item">
                            <div class="space-info-header">
                                <span class="space-info-label">私人空间</span>
                                <span class="space-info-value" id="personal-space-value">0 MB / 2 GB</span>
                            </div>
                            <div class="space-bar">
                                <div id="personal-space-fill" class="space-fill personal" style="width: 0%"></div>
                            </div>
                        </div>
                        <div class="space-info-item">
                            <div class="space-info-header">
                                <span class="space-info-label">公共空间</span>
                                <span class="space-info-value" id="public-space-value">0 MB / 5 GB</span>
                            </div>
                            <div class="space-bar">
                                <div id="public-space-fill" class="space-fill public" style="width: 0%"></div>
                            </div>
                        </div>
                        <div class="space-info-item">
                            <div class="space-info-header">
                                <span class="space-info-label">全局空间</span>
                                <span class="space-info-value" id="global-space-value">0 MB / 10 GB</span>
                            </div>
                            <div class="space-bar">
                                <div id="global-space-fill" class="space-fill global" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="main-content">
                <!-- 顶部操作栏 -->
                <div class="top-bar">
                    <div class="top-bar-left">
                        <h1><i class="fas fa-cloud-upload-alt"></i> 网盘</h1>
                        <span class="user-info">
                            <i class="fas fa-user"></i>
                            <span id="user-id">欢迎您</span>
                            <span id="admin-badge" class="admin-badge" style="display: none;">管理员</span>
                        </span>
                    </div>
                    <div class="top-bar-right">
                        <button class="btn btn-secondary" onclick="showChangePassword()">
                            <i class="fas fa-key"></i> 修改密码
                        </button>
                        <button class="btn btn-secondary" onclick="showLogin()">
                            <i class="fas fa-sign-out-alt"></i> 切换用户
                        </button>
                    </div>
                </div>

                <!-- 工具栏 -->
                <div class="toolbar">
                    <div class="toolbar-left">
                        <div class="view-toggle">
                            <button class="active" data-view="list"><i class="fas fa-list"></i> 列表</button>
                            <button data-view="grid"><i class="fas fa-th-large"></i> 图标</button>
                        </div>
                        <select id="sort-select" class="sort-select" onchange="sortFiles()">
                            <option value="date-desc">按时间排序（最新优先）</option>
                            <option value="date-asc">按时间排序（最早优先）</option>
                            <option value="size-desc">按大小排序（从大到小）</option>
                            <option value="size-asc">按大小排序（从小到大）</option>
                            <option value="name-asc">按名称排序（A-Z）</option>
                            <option value="name-desc">按名称排序（Z-A）</option>
                        </select>
                    </div>
                    <div class="toolbar-right">
                        <div class="search-box">
                            <i class="fas fa-search"></i>
                            <input type="text" id="search-input" placeholder="搜索文件..." onkeyup="searchFiles()">
                        </div>
                        <button class="btn" onclick="document.getElementById('file-input').click()">
                            <i class="fas fa-upload"></i> 上传文件
                        </button>
                    </div>
                </div>

                <!-- 上传区域 -->
                <div class="upload-area" id="upload-area">
                    <div class="upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                    <h2 class="upload-text">拖拽文件到此处或点击上传</h2>
                    <p class="upload-subtext">支持所有文件类型</p>
                    <input type="file" id="file-input" multiple>
                    <div class="upload-options">
                        <button class="btn" onclick="document.getElementById('file-input').click()">
                            <i class="fas fa-folder-open"></i> 选择文件
                        </button>
                        <button class="btn btn-outline" onclick="uploadToPublic()">
                            <i class="fas fa-users"></i> 上传到公共空间
                        </button>
                    </div>
                    <div class="progress-bar" id="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                </div>

                <!-- 文件列表区域 -->
                <div class="files-section">
                    <div class="section-header">
                        <h2><i class="fas fa-folder-open"></i> <span id="section-title">个人文件</span></h2>
                        <div class="section-actions">
                            <button class="btn btn-sm" onclick="selectAllFiles()">
                                <i class="fas fa-check-square"></i> 全选
                            </button>
                            <button class="btn btn-sm" onclick="batchMoveFiles()">
                                <i class="fas fa-cut"></i> 移动
                            </button>
                            <button class="btn btn-sm" onclick="batchRenameFiles()">
                                <i class="fas fa-edit"></i> 重命名
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteSelectedFiles()">
                                <i class="fas fa-trash"></i> 删除
                            </button>
                        </div>
                    </div>
                    <div class="file-list-view" id="file-list-view">
                        <ul id="file-list">
                            <!-- 文件列表将通过JavaScript动态生成 -->
                        </ul>
                    </div>
                    <div class="file-grid-view" id="file-grid-view" style="display: none;">
                        <!-- 图标视图将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 密码修改弹窗 -->
    <div id="change-password-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>修改密码</h2>
                <button class="modal-close" onclick="closeChangePassword()">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleChangePassword(event)">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="current-password">当前密码</label>
                        <input type="password" id="current-password" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="new-password">新密码</label>
                        <input type="password" id="new-password" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeChangePassword()">取消</button>
                        <button type="submit" class="btn">确认修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 预览弹窗 -->
    <div id="preview-modal" class="modal">
        <div class="modal-content" style="width: 90%; max-width: 800px; max-height: 80vh; overflow: auto;">
            <div class="modal-header">
                <h2>文件预览</h2>
                <button class="modal-close" onclick="closePreviewModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="preview-content" style="width: 100%;">
                    <!-- 预览内容将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 分享弹窗 -->
    <div id="share-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>分享文件</h2>
                <button class="modal-close" onclick="closeShareModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleShareFile(event)">
                    <input type="hidden" id="share-file-name">
                    <input type="hidden" id="share-user-dir">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="share-expiry">有效期</label>
                        <select id="share-expiry" required style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                            <option value="1">1天</option>
                            <option value="7">7天</option>
                            <option value="30">30天</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="share-url">分享链接</label>
                        <input type="text" id="share-url" readonly style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: var(--border-radius);">
                        <button type="button" class="btn btn-sm" onclick="copyShareUrl()" style="margin-top: 10px;">复制链接</button>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeShareModal()">取消</button>
                        <button type="submit" class="btn">生成链接</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
