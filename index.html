<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>百度网盘</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #19b955;
            --primary-dark: #14a34a;
            --primary-light: #e8f8ee;
            --primary-bg: #f0faf3;
            --bg: #f5f6fa;
            --bg-white: #ffffff;
            --text-primary: #222;
            --text-secondary: #666;
            --text-muted: #999;
            --border: #eee;
            --border-light: #f5f5f5;
            --success: #19b955;
            --danger: #fa5151;
            --warning: #ff9500;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.12);
            --radius: 8px;
            --radius-sm: 6px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            --transition: all 0.2s ease;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #bbb; }

        .network-status {
            position: fixed;
            top: 12px;
            right: 16px;
            padding: 6px 14px;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: 50px;
            box-shadow: var(--shadow-sm);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 1000;
        }
        .network-status i { font-size: 11px; }
        .network-status.good i { color: var(--success); }
        .network-status.warning i { color: var(--warning); }
        .network-status.bad i { color: var(--danger); }

        .login-container {
            max-width: 400px;
            margin: 100px auto;
            background: var(--bg-white);
            padding: 48px 36px 36px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: fadeInUp 0.5s ease;
        }
        .login-container .logo {
            margin-bottom: 8px;
        }
        .login-container .logo i {
            font-size: 48px;
            color: var(--primary);
        }
        .login-container h1 {
            color: var(--text-primary);
            margin-bottom: 8px;
            font-size: 22px;
            font-weight: 700;
        }
        .login-container .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .form-group {
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: var(--text-primary);
            font-size: 14px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            transition: var(--transition);
            background: #fafafa;
            color: var(--text-primary);
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 3px rgba(25, 185, 85, 0.1);
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 230px;
            background: var(--bg-white);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
        }
        .sidebar-header {
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
        }
        .sidebar-header .logo i {
            color: var(--primary);
            font-size: 24px;
        }
        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 12px;
        }
        .sidebar-upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 16px;
        }
        .sidebar-upload-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(25, 185, 85, 0.3);
        }
        .sidebar-nav {
            list-style: none;
        }
        .sidebar-nav li {
            margin-bottom: 2px;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }
        .sidebar-nav a i {
            width: 18px;
            text-align: center;
            font-size: 16px;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .sidebar-nav a:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .sidebar-nav a:hover i {
            color: var(--primary);
        }
        .sidebar-nav a.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }
        .sidebar-nav a.active i {
            color: var(--primary);
        }
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }
        .sidebar-space-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .sidebar-space-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .sidebar-space-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 2px;
            transition: width 0.5s ease;
        }
        .sidebar-space-text {
            font-size: 11px;
            color: var(--text-muted);
        }

        .main-content {
            flex: 1;
            margin-left: 230px;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .top-bar {
            background: var(--bg-white);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .top-bar-left h1 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-bar-left h1 i {
            color: var(--primary);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .user-info i {
            color: var(--primary);
            font-size: 16px;
        }
        .admin-badge {
            padding: 1px 8px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }
        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-body {
            padding: 24px 32px;
            flex: 1;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .view-toggle {
            display: flex;
            background: var(--border);
            border-radius: var(--radius-sm);
            padding: 2px;
        }
        .view-toggle button {
            padding: 6px 12px;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            border-radius: 5px;
            color: var(--text-muted);
        }
        .view-toggle button:hover {
            color: var(--text-secondary);
        }
        .view-toggle button.active {
            background: var(--bg-white);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        .sort-select {
            padding: 6px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: var(--bg-white);
            cursor: pointer;
            color: var(--text-secondary);
        }
        .sort-select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .search-box {
            position: relative;
        }
        .search-box input {
            padding: 6px 12px 6px 34px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            transition: var(--transition);
            width: 180px;
            background: var(--bg-white);
            color: var(--text-primary);
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            width: 220px;
        }
        .search-box input::placeholder {
            color: #bbb;
        }
        .search-box i {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: #bbb;
            font-size: 13px;
            pointer-events: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 7px 16px;
            background: var(--bg-white);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
            text-decoration: none;
            white-space: nowrap;
        }
        .btn:hover {
            border-color: #ddd;
            color: var(--text-primary);
            background: #fafafa;
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: var(--primary-dark);
            border-color: var(--primary-dark);
            color: #fff;
        }
        .btn-secondary {
            background: var(--border);
            color: var(--text-secondary);
            border-color: transparent;
        }
        .btn-secondary:hover {
            background: #ddd;
            color: var(--text-primary);
        }
        .btn-danger {
            color: var(--danger);
            border-color: #fee;
        }
        .btn-danger:hover {
            background: #fef2f2;
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-sm {
            padding: 4px 10px;
            font-size: 12px;
        }
        .btn-text {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            padding: 4px 8px;
        }
        .btn-text:hover {
            background: var(--border);
            color: var(--text-primary);
        }
        .btn-text.btn-danger-text {
            color: var(--text-muted);
        }
        .btn-text.btn-danger-text:hover {
            background: #fef2f2;
            color: var(--danger);
        }

        .upload-area {
            background: #fafafa;
            border: 2px dashed #ddd;
            border-radius: var(--radius-lg);
            padding: 48px 24px;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
            margin-bottom: 20px;
        }
        .upload-area:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .upload-area.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
            border-style: solid;
        }
        .upload-area .upload-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .upload-area .upload-icon i {
            font-size: 28px;
            color: var(--primary);
        }
        .upload-area:hover .upload-icon {
            transform: scale(1.05);
        }
        .upload-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
        }
        .upload-subtext {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 16px;
        }
        .upload-options {
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        #file-input {
            display: none;
        }

        .files-section {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .section-header {
            padding: 14px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-header h2 {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        .section-header h2 i {
            color: var(--primary);
        }
        .section-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .file-list-view {
            flex: 1;
            overflow-y: auto;
        }
        #file-list {
            list-style: none;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-light);
            transition: var(--transition);
            cursor: default;
            animation: fadeInUp 0.3s ease both;
        }
        .file-item:nth-child(1) { animation-delay: 0s; }
        .file-item:nth-child(2) { animation-delay: 0.04s; }
        .file-item:nth-child(3) { animation-delay: 0.08s; }
        .file-item:nth-child(4) { animation-delay: 0.12s; }
        .file-item:nth-child(5) { animation-delay: 0.16s; }
        .file-item:nth-child(n+6) { animation-delay: 0.2s; }
        .file-item:hover {
            background: #fafafa;
        }
        .file-item.selected {
            background: var(--primary-light);
        }

        .file-checkbox {
            margin-right: 14px;
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }

        .file-thumb {
            width: 40px;
            height: 40px;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
            font-size: 22px;
        }
        .file-thumb.image { color: #10b981; background: #ecfdf5; }
        .file-thumb.pdf { color: #ef4444; background: #fef2f2; }
        .file-thumb.doc { color: #3b82f6; background: #eff6ff; }
        .file-thumb.excel { color: #10b981; background: #ecfdf5; }
        .file-thumb.ppt { color: #f59e0b; background: #fffbeb; }
        .file-thumb.zip { color: #8b5cf6; background: #f5f3ff; }
        .file-thumb.audio { color: #ec4899; background: #fdf2f8; }
        .file-thumb.video { color: #6366f1; background: #eef2ff; }
        .file-thumb.code { color: #14b8a6; background: #f0fdfa; }
        .file-thumb.text { color: #64748b; background: #f8fafc; }
        .file-thumb.default { color: var(--text-muted); background: var(--border); }

        .file-info {
            flex: 1;
            min-width: 0;
        }
        .file-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
        }
        .file-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .file-item:hover .file-actions {
            opacity: 1;
        }

        .file-grid-view {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }
        .file-grid-item {
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 12px 14px;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            animation: fadeInUp 0.3s ease both;
        }
        .file-grid-item:nth-child(1) { animation-delay: 0s; }
        .file-grid-item:nth-child(2) { animation-delay: 0.05s; }
        .file-grid-item:nth-child(3) { animation-delay: 0.1s; }
        .file-grid-item:nth-child(4) { animation-delay: 0.15s; }
        .file-grid-item:nth-child(n+5) { animation-delay: 0.2s; }
        .file-grid-item:hover {
            border-color: #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .file-grid-item.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .file-grid-thumb {
            width: 56px;
            height: 56px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            font-size: 28px;
        }
        .file-grid-thumb.image { color: #10b981; background: #ecfdf5; }
        .file-grid-thumb.pdf { color: #ef4444; background: #fef2f2; }
        .file-grid-thumb.doc { color: #3b82f6; background: #eff6ff; }
        .file-grid-thumb.excel { color: #10b981; background: #ecfdf5; }
        .file-grid-thumb.ppt { color: #f59e0b; background: #fffbeb; }
        .file-grid-thumb.zip { color: #8b5cf6; background: #f5f3ff; }
        .file-grid-thumb.audio { color: #ec4899; background: #fdf2f8; }
        .file-grid-thumb.video { color: #6366f1; background: #eef2ff; }
        .file-grid-thumb.code { color: #14b8a6; background: #f0fdfa; }
        .file-grid-thumb.text { color: #64748b; background: #f8fafc; }
        .file-grid-thumb.default { color: var(--text-muted); background: var(--border); }
        .file-grid-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-grid-meta {
            font-size: 11px;
            color: var(--text-muted);
        }
        .file-grid-actions {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 2px;
            opacity: 0;
            transition: var(--transition);
        }
        .file-grid-item:hover .file-grid-actions {
            opacity: 1;
        }
        .file-grid-actions .btn {
            padding: 3px 6px;
            font-size: 11px;
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--border);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 12px;
            color: #ddd;
        }
        .empty-state h3 {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .empty-state p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 16px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
            position: relative;
        }
        .progress-fill::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 1.2s infinite;
        }
        .progress-fill::after {
            content: attr(data-speed);
            position: absolute;
            top: 10px;
            right: 0;
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            font-weight: 500;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.45);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s ease;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--bg-white);
            padding: 28px 32px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            width: 90%;
            max-width: 420px;
            animation: scaleIn 0.25s ease;
        }
        .modal-content.large {
            max-width: 760px;
            max-height: 80vh;
            overflow: hidden;
        }
        .modal-content.large .modal-body {
            max-height: calc(80vh - 130px);
            overflow: auto;
        }
        .modal-header {
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .modal-close {
            background: transparent;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: var(--border);
            color: var(--text-primary);
        }
        .modal-body { margin-bottom: 18px; }
        .modal-footer {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            background: var(--text-primary);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            z-index: 10000;
            animation: toastIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast i {
            color: var(--success);
            font-size: 16px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-12px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        @media (max-width: 1200px) {
            .file-grid-view { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 200px;
                transform: translateX(-100%);
            }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .top-bar { padding: 0 16px; }
            .content-body { padding: 16px; }
            .toolbar { flex-direction: column; align-items: flex-start; }
            .toolbar-left, .toolbar-right { width: 100%; }
            .toolbar-right { justify-content: flex-end; }
            .upload-area { padding: 32px 16px; }
            .file-item { padding: 10px 14px; }
            .file-actions { opacity: 1; }
            .file-grid-view { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
            .file-grid-item { padding: 14px 8px; }
            .file-grid-thumb { width: 44px; height: 44px; font-size: 22px; }
            .search-box input { width: 140px; }
            .search-box input:focus { width: 160px; }
            .network-status { display: none; }
        }

        @media (max-width: 480px) {
            .login-container { margin: 40px auto; padding: 32px 20px; }
            .content-body { padding: 12px; }
            .file-grid-view { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
        }
    </style>
</head>
<body>
    <!-- 网络延迟显示 -->
    <div class="network-status" id="network-status">
        <i class="fas fa-wifi"></i>
        <span id="ping-value">-- ms</span>
    </div>

    <!-- 登录界面 -->
    <div id="login-container" class="login-container">
        <div class="logo"><i class="fas fa-cloud-upload-alt"></i></div>
        <h1>网盘登录</h1>
        <p class="subtitle">输入密码访问你的个人网盘</p>
        <form class="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="login-password">密码</label>
                <input type="password" id="login-password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 11px;">
                <i class="fas fa-sign-in-alt"></i> 登录
            </button>
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <span style="color: var(--text-muted); font-size: 14px;">还没有账号？</span>
            <button class="btn btn-text" onclick="showRegisterModal()" style="width: 100%; margin-top: 8px; justify-content: center; color: var(--primary); font-weight: 500;">
                <i class="fas fa-user-plus"></i> 注册账号
            </button>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>注册账号</h2>
                <button class="modal-close" onclick="closeRegisterModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="register-password">密码</label>
                        <input type="password" id="register-password" required style="width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: var(--radius);">
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="confirm-password">确认密码</label>
                        <input type="password" id="confirm-password" required style="width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: var(--radius);">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeRegisterModal()">取消</button>
                        <button type="submit" class="btn">注册</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="main-container" style="display: none;">
        <div class="main-layout">
            <!-- 侧边栏 -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <a href="#" class="logo">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>百度网盘</span>
                    </a>
                </div>
                <div class="sidebar-body">
                    <button class="sidebar-upload-btn" onclick="document.getElementById('file-input').click()">
                        <i class="fas fa-cloud-arrow-up"></i> 上传文件
                    </button>
                    <ul class="sidebar-nav" id="sidebar-nav">
                        <li><a href="#" class="active" data-view="personal"><i class="fas fa-folder"></i> 个人文件</a></li>
                        <li><a href="#" data-view="public"><i class="fas fa-users"></i> 公共空间</a></li>
                    </ul>
                </div>
                <div class="sidebar-footer">
                    <div class="sidebar-space-label">空间使用</div>
                    <div class="sidebar-space-bar">
                        <div id="sidebar-space-fill" class="sidebar-space-fill" style="width: 0%"></div>
                    </div>
                    <div class="sidebar-space-text" id="sidebar-space-text">0 MB / 2 GB</div>
                </div>
            </div>

            <!-- 主内容区 -->
            <div class="main-content">
                <!-- 顶部操作栏 -->
                <div class="top-bar">
                    <div class="top-bar-left">
                        <h1><i class="fas fa-folder-open"></i> <span id="section-title">个人文件</span></h1>
                        <span class="user-info">
                            <i class="fas fa-user-circle"></i>
                            <span id="user-id">用户</span>
                            <span id="admin-badge" class="admin-badge" style="display: none;">管理员</span>
                        </span>
                    </div>
                    <div class="top-bar-right">
                        <button class="btn btn-text" onclick="showChangePassword()" title="修改密码">
                            <i class="fas fa-key"></i>
                        </button>
                        <button class="btn btn-text" onclick="showLogin()" title="切换用户">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>

                <div class="content-body">
                    <!-- 工具栏 -->
                    <div class="toolbar">
                        <div class="toolbar-left">
                            <div class="view-toggle">
                                <button class="active" data-view="list"><i class="fas fa-list"></i> 列表</button>
                                <button data-view="grid"><i class="fas fa-th-large"></i> 图标</button>
                            </div>
                            <select id="sort-select" class="sort-select" onchange="sortFiles()">
                                <option value="date-desc">按时间排序（最新优先）</option>
                                <option value="date-asc">按时间排序（最早优先）</option>
                                <option value="size-desc">按大小排序（从大到小）</option>
                                <option value="size-asc">按大小排序（从小到大）</option>
                                <option value="name-asc">按名称排序（A-Z）</option>
                                <option value="name-desc">按名称排序（Z-A）</option>
                            </select>
                        </div>
                        <div class="toolbar-right">
                            <div class="search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" id="search-input" placeholder="搜索文件..." onkeyup="searchFiles()">
                            </div>
                            <button class="btn btn-sm" onclick="selectAllFiles()">
                                <i class="fas fa-check-square"></i> 全选
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteSelectedFiles()">
                                <i class="fas fa-trash-alt"></i> 删除
                            </button>
                        </div>
                    </div>

                    <!-- 上传区域 -->
                    <div class="upload-area" id="upload-area">
                        <div class="upload-icon"><i class="fas fa-cloud-arrow-up"></i></div>
                        <div class="upload-text">拖拽文件到此处或点击上传</div>
                        <div class="upload-subtext">支持所有文件类型，单文件最大 10GB</div>
                        <input type="file" id="file-input" multiple>
                        <div class="upload-options">
                            <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
                                <i class="fas fa-folder-open"></i> 选择文件
                            </button>
                            <button class="btn" onclick="uploadToPublic()">
                                <i class="fas fa-users"></i> 上传到公共空间
                            </button>
                        </div>
                        <div class="progress-bar" id="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                    </div>

                    <!-- 文件列表区域 -->
                    <div class="files-section">
                        <div class="section-header">
                            <h2><i class="fas fa-folder-open"></i> 全部文件</h2>
                        </div>
                        <div class="file-list-view" id="file-list-view">
                            <ul id="file-list">
                                <!-- 文件列表将通过JavaScript动态生成 -->
                            </ul>
                        </div>
                        <div class="file-grid-view" id="file-grid-view" style="display: none;">
                            <!-- 图标视图将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 密码修改弹窗 -->
    <div id="change-password-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>修改密码</h2>
                <button class="modal-close" onclick="closeChangePasswordModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleChangePassword(event)">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="current-password">当前密码</label>
                        <input type="password" id="current-password" required style="width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: var(--radius);">
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="new-password">新密码</label>
                        <input type="password" id="new-password" required style="width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: var(--radius);">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeChangePasswordModal()">取消</button>
                        <button type="submit" class="btn">确认修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 预览弹窗 -->
    <div id="preview-modal" class="modal">
        <div class="modal-content large">
            <div class="modal-header">
                <h2>文件预览</h2>
                <button class="modal-close" onclick="closePreviewModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="preview-content" style="width: 100%;">
                    <!-- 预览内容将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 分享弹窗 -->
    <div id="share-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>分享文件</h2>
                <button class="modal-close" onclick="closeShareModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleShareFile(event)">
                    <input type="hidden" id="share-file-name">
                    <input type="hidden" id="share-user-dir">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="share-expiry">有效期</label>
                        <select id="share-expiry" required style="width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: var(--radius);">
                            <option value="1">1天</option>
                            <option value="7">7天</option>
                            <option value="30">30天</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="share-url">分享链接</label>
                        <input type="text" id="share-url" readonly style="width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: var(--radius);">
                        <button type="button" class="btn btn-sm" onclick="copyShareUrl()" style="margin-top: 10px;">复制链接</button>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeShareModal()">取消</button>
                        <button type="submit" class="btn">生成链接</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentPassword = '';
        let files = [];
        let publicFiles = [];
        let currentView = 'personal'; // personal or public
        let displayView = 'list'; // list or grid
        let selectedFiles = [];
        let usedSize = 0;
        let maxSize = 2 * 1024 * 1024 * 1024; // 2GB
        let globalUsedSize = 0;
        let globalMaxSize = 10 * 1024 * 1024 * 1024; // 10GB
        let publicUsedSize = 0;
        let publicMaxSize = 5 * 1024 * 1024 * 1024; // 5GB
        let isAdmin = false;

        // DOM元素
        const loginContainer = document.getElementById('login-container');
        const mainContainer = document.getElementById('main-container');
        const loginPassword = document.getElementById('login-password');
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const fileListView = document.getElementById('file-list-view');
        const fileGridView = document.getElementById('file-grid-view');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const changePasswordModal = document.getElementById('change-password-modal');
        const networkStatus = document.getElementById('network-status');
        const pingValue = document.getElementById('ping-value');

        // 初始化
        function init() {
            const savedPassword = localStorage.getItem('panPassword');
            if (savedPassword) {
                currentPassword = savedPassword;
                showMain();
                refreshFileList();
            } else {
                showLogin();
            }
            
            // 初始化拖拽上传
            initDragAndDrop();
            
            // 初始化文件输入
            initFileInput();
            
            // 初始化视图切换
            initViewToggle();
            
            // 初始化侧边栏导航
            initSidebarNavigation();
            
            // 开始网络延迟检测
            startNetworkPing();
        }

        // 显示登录界面
        function showLogin() {
            loginContainer.style.display = 'block';
            mainContainer.style.display = 'none';
            loginPassword.value = '';
            loginPassword.focus();
        }

        // 显示注册弹窗
        function showRegisterModal() {
            document.getElementById('register-modal').classList.add('show');
        }

        // 关闭注册弹窗
        function closeRegisterModal() {
            document.getElementById('register-modal').classList.remove('show');
            document.getElementById('register-password').value = '';
            document.getElementById('confirm-password').value = '';
        }

        // 显示主界面
        function showMain() {
            loginContainer.style.display = 'none';
            mainContainer.style.display = 'block';
            
            // 显示管理员标识
            const adminBadge = document.getElementById('admin-badge');
            if (isAdmin) {
                adminBadge.style.display = 'inline-block';
            } else {
                adminBadge.style.display = 'none';
            }
        }

        // 处理登录
        function handleLogin(event) {
            event.preventDefault();
            const password = loginPassword.value.trim();
            if (!password) {
                alert('请输入密码');
                return;
            }
            
            fetch('upload.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `action=login&password=${encodeURIComponent(password)}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    currentPassword = password;
                    isAdmin = data.role === 'admin';
                    localStorage.setItem('panPassword', password);
                    showMain();
                    refreshFileList();
                } else {
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error('登录失败:', error);
                alert('登录失败，请重试');
            });
        }

        // 处理注册
        function handleRegister(event) {
            event.preventDefault();
            const password = document.getElementById('register-password').value.trim();
            const confirmPassword = document.getElementById('confirm-password').value.trim();
            
            if (!password) {
                alert('请输入密码');
                return;
            }
            
            if (password !== confirmPassword) {
                alert('两次输入的密码不一致');
                return;
            }
            
            fetch('upload.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `action=register&password=${encodeURIComponent(password)}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    currentPassword = password;
                    isAdmin = data.role === 'admin';
                    localStorage.setItem('panPassword', password);
                    document.getElementById('register-modal').classList.remove('show');
                    showMain();
                    refreshFileList();
                    showToast('注册成功');
                } else {
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error('注册失败:', error);
                alert('注册失败，请重试');
            });
        }

        // 显示修改密码弹窗
        function showChangePassword() {
            changePasswordModal.classList.add('show');
        }

        // 关闭修改密码弹窗
        function closeChangePasswordModal() {
            changePasswordModal.classList.remove('show');
            document.getElementById('current-password').value = '';
            document.getElementById('new-password').value = '';
        }

        // 处理密码修改
        function handleChangePassword(event) {
            event.preventDefault();
            const currentPasswordInput = document.getElementById('current-password').value;
            const newPasswordInput = document.getElementById('new-password').value;
            
            if (currentPasswordInput && newPasswordInput) {
                fetch('upload.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `action=change_password&current_password=${encodeURIComponent(currentPasswordInput)}&new_password=${encodeURIComponent(newPasswordInput)}`
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        alert('密码修改成功，请重新登录');
                        currentPassword = newPasswordInput;
                        localStorage.setItem('panPassword', newPasswordInput);
                        closeChangePasswordModal();
                        showLogin();
                    } else {
                        alert('密码修改失败：' + data.message);
                    }
                })
                .catch(error => {
                    console.error('密码修改失败:', error);
                    alert('密码修改失败，请重试');
                });
            }
        }

        // 初始化拖拽上传
        function initDragAndDrop() {
            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.classList.add('dragover');
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.classList.remove('dragover');
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.classList.remove('dragover');
                if (e.dataTransfer.files.length > 0) {
                    uploadFiles(e.dataTransfer.files, false);
                }
            });

            // 点击上传区域也可以选择文件
            uploadArea.addEventListener('click', (e) => {
                // 避免点击按钮时触发
                if (!e.target.closest('button')) {
                    fileInput.click();
                }
            });
        }

        // 初始化文件输入
        function initFileInput() {
            fileInput.addEventListener('change', (e) => {
                if (e.target.files.length > 0) {
                    uploadFiles(e.target.files, false);
                }
            });
        }

        // 上传到公共空间
        function uploadToPublic() {
            fileInput.click();
            // 标记为上传到公共空间
            fileInput.dataset.isPublic = 'true';
        }

        // 上传文件
        function uploadFiles(fileList, isPublic = false) {
            // 检查是否标记为上传到公共空间
            if (fileInput.dataset.isPublic === 'true') {
                isPublic = true;
                fileInput.dataset.isPublic = 'false';
            }

            const formData = new FormData();
            
            for (let i = 0; i < fileList.length; i++) {
                formData.append('files[]', fileList[i]);
            }
            
            formData.append('password', currentPassword);
            formData.append('is_public', isPublic);

            // 显示进度条
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';

            // 计算总文件大小
            let totalSize = 0;
            for (let i = 0; i < fileList.length; i++) {
                totalSize += fileList[i].size;
            }

            // 上传开始时间
            const startTime = Date.now();
            let uploadedSize = 0;

            // 使用XMLHttpRequest实现实时进度
            const xhr = new XMLHttpRequest();

            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    uploadedSize = e.loaded;
                    const progress = (uploadedSize / totalSize) * 100;
                    progressFill.style.width = `${progress}%`;

                    // 计算上传速度
                    const elapsedTime = (Date.now() - startTime) / 1000;
                    if (elapsedTime > 0) {
                        const speed = uploadedSize / elapsedTime;
                        const speedText = formatFileSize(speed) + '/s';
                        progressFill.setAttribute('data-speed', speedText);
                    }
                }
            });

            xhr.addEventListener('load', function() {
                try {
                    const data = JSON.parse(xhr.responseText);
                    if (data.success) {
                        refreshFileList();
                        // 更新空间使用情况
                        if (data.usedSize) {
                            updateSpaceUsage(data);
                        }
                        // 显示成功提示
                        showToast('文件上传成功');
                    } else {
                        alert('上传失败：' + data.message);
                    }
                } catch (error) {
                    alert('上传失败，请重试');
                }
                // 隐藏进度条
                progressBar.style.display = 'none';
            });

            xhr.addEventListener('error', function() {
                alert('上传失败，请重试');
                progressBar.style.display = 'none';
            });

            xhr.open('POST', 'upload.php');
            xhr.send(formData);
        }

        // 刷新文件列表
        function refreshFileList() {
            fetch(`files.php?password=${encodeURIComponent(currentPassword)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        files = data.files;
                        publicFiles = data.publicFiles || [];
                        // 更新空间使用情况
                        updateSpaceUsage(data);
                        renderFiles();
                    } else {
                        console.error('获取文件列表失败:', data.message);
                    }
                })
                .catch(error => {
                    console.error('获取文件列表失败:', error);
                });
        }

        // 更新空间使用情况
        function updateSpaceUsage(data) {
            usedSize = data.usedSize || 0;
            maxSize = data.maxSize || 2 * 1024 * 1024 * 1024;
            globalUsedSize = data.globalUsedSize || 0;
            globalMaxSize = data.globalMaxSize || 10 * 1024 * 1024 * 1024;
            publicUsedSize = data.publicUsedSize || 0;
            publicMaxSize = data.publicMaxSize || 5 * 1024 * 1024 * 1024;

            const sidebarSpaceFill = document.getElementById('sidebar-space-fill');
            const sidebarSpaceText = document.getElementById('sidebar-space-text');
            const percentage = (usedSize / maxSize) * 100;
            sidebarSpaceFill.style.width = `${percentage}%`;
            sidebarSpaceText.textContent = `${formatFileSize(usedSize)} / ${formatFileSize(maxSize)}`;
        }

        // 初始化视图切换
        function initViewToggle() {
            const viewToggleButtons = document.querySelectorAll('.view-toggle button');
            viewToggleButtons.forEach(button => {
                button.addEventListener('click', () => {
                    viewToggleButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    displayView = button.dataset.view;
                    renderFiles();
                });
            });
        }

        // 初始化侧边栏导航
        function initSidebarNavigation() {
            const sidebarLinks = document.querySelectorAll('.sidebar-nav a');
            sidebarLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    sidebarLinks.forEach(lnk => lnk.classList.remove('active'));
                    link.classList.add('active');
                    currentView = link.dataset.view;
                    document.getElementById('section-title').textContent = currentView === 'personal' ? '个人文件' : '公共空间';
                    renderFiles();
                });
            });
        }

        // 排序文件
        function sortFiles() {
            const sortValue = document.getElementById('sort-select').value;
            const currentFiles = currentView === 'personal' ? files : publicFiles;
            
            switch (sortValue) {
                case 'date-desc':
                    currentFiles.sort((a, b) => b.date - a.date);
                    break;
                case 'date-asc':
                    currentFiles.sort((a, b) => a.date - b.date);
                    break;
                case 'size-desc':
                    currentFiles.sort((a, b) => b.size - a.size);
                    break;
                case 'size-asc':
                    currentFiles.sort((a, b) => a.size - b.size);
                    break;
                case 'name-asc':
                    currentFiles.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'name-desc':
                    currentFiles.sort((a, b) => b.name.localeCompare(a.name));
                    break;
            }
            
            renderFiles();
        }

        // 搜索文件
        function searchFiles() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const currentFiles = currentView === 'personal' ? files : publicFiles;
            const filteredFiles = currentFiles.filter(file => 
                file.name.toLowerCase().includes(searchTerm)
            );
            renderFiles(filteredFiles);
        }

        // 渲染文件
        function renderFiles(filteredFiles = null) {
            const currentFiles = filteredFiles || (currentView === 'personal' ? files : publicFiles);
            
            if (displayView === 'list') {
                renderListView(currentFiles);
            } else {
                renderGridView(currentFiles);
            }
        }

        // 渲染列表视图
        function renderListView(files) {
            fileListView.style.display = 'block';
            fileGridView.style.display = 'none';
            
            if (files.length === 0) {
                fileList.innerHTML = `
                    <li class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <h3>暂无文件</h3>
                        <p>上传文件开始使用网盘</p>
                    </li>
                `;
                return;
            }

            fileList.innerHTML = '';
            
            files.forEach(file => {
                const li = document.createElement('li');
                li.className = 'file-item';
                li.dataset.filename = file.filename;
                
                // 根据文件扩展名设置图标和缩略图样式
                const ext = file.name.split('.').pop().toLowerCase();
                let fileIcon = 'fas fa-file';
                let thumbClass = 'default';
                if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) { fileIcon = 'fas fa-file-image'; thumbClass = 'image'; }
                else if (ext === 'pdf') { fileIcon = 'fas fa-file-pdf'; thumbClass = 'pdf'; }
                else if (['doc', 'docx'].includes(ext)) { fileIcon = 'fas fa-file-word'; thumbClass = 'doc'; }
                else if (['xls', 'xlsx'].includes(ext)) { fileIcon = 'fas fa-file-excel'; thumbClass = 'excel'; }
                else if (['ppt', 'pptx'].includes(ext)) { fileIcon = 'fas fa-file-powerpoint'; thumbClass = 'ppt'; }
                else if (['zip', 'rar', '7z'].includes(ext)) { fileIcon = 'fas fa-file-archive'; thumbClass = 'zip'; }
                else if (['mp3', 'wav', 'flac'].includes(ext)) { fileIcon = 'fas fa-file-audio'; thumbClass = 'audio'; }
                else if (['mp4', 'avi', 'mov'].includes(ext)) { fileIcon = 'fas fa-file-video'; thumbClass = 'video'; }
                else if (['js', 'css', 'html', 'php'].includes(ext)) { fileIcon = 'fas fa-file-code'; thumbClass = 'code'; }
                else if (['txt', 'md'].includes(ext)) { fileIcon = 'fas fa-file-alt'; thumbClass = 'text'; }

                // 构建下载链接
                let downloadUrl = `download.php?file=${encodeURIComponent(file.filename)}&password=${encodeURIComponent(currentPassword)}`;
                if (file.userDir) {
                    downloadUrl += `&userDir=${encodeURIComponent(file.userDir)}`;
                }

                li.innerHTML = `
                    <input type="checkbox" class="file-checkbox" onchange="toggleFileSelection('${file.filename}')">
                    <div class="file-thumb ${thumbClass}"><i class="${fileIcon}"></i></div>
                    <div class="file-info">
                        <div class="file-name">${file.name}</div>
                        <div class="file-meta">
                            <span>${formatFileSize(file.size)}</span>
                            <span>${formatDate(file.date)}</span>
                            ${file.userDir ? `<span>用户: ${file.userDir.substring(0, 8)}...</span>` : ''}
                        </div>
                    </div>
                    <div class="file-actions">
                        <button class="btn btn-text" onclick="previewFile('${file.filename}', ${file.userDir ? `'${file.userDir}'` : 'null'})" title="预览">
                            <i class="fas fa-eye"></i>
                        </button>
                        <button class="btn btn-text" onclick="shareFile('${file.filename}', ${file.userDir ? `'${file.userDir}'` : 'null'})" title="分享">
                            <i class="fas fa-share-alt"></i>
                        </button>
                        <a href="${downloadUrl}" class="btn btn-text" download="${file.name}" title="下载">
                            <i class="fas fa-download"></i>
                        </a>
                        <button class="btn btn-text btn-danger-text" onclick="deleteFile('${file.filename}', ${file.userDir ? `'${file.userDir}'` : 'null'})" title="删除">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
                
                fileList.appendChild(li);
            });
        }

        // 渲染图标视图
        function renderGridView(files) {
            fileListView.style.display = 'none';
            fileGridView.style.display = 'grid';
            
            if (files.length === 0) {
                fileGridView.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <h3>暂无文件</h3>
                        <p>上传文件开始使用网盘</p>
                    </div>
                `;
                return;
            }

            fileGridView.innerHTML = '';
            
            files.forEach(file => {
                const div = document.createElement('div');
                div.className = 'file-grid-item';
                div.dataset.filename = file.filename;
                
                const ext = file.name.split('.').pop().toLowerCase();
                let fileIcon = 'fas fa-file';
                let thumbClass = 'default';
                if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) { fileIcon = 'fas fa-file-image'; thumbClass = 'image'; }
                else if (ext === 'pdf') { fileIcon = 'fas fa-file-pdf'; thumbClass = 'pdf'; }
                else if (['doc', 'docx'].includes(ext)) { fileIcon = 'fas fa-file-word'; thumbClass = 'doc'; }
                else if (['xls', 'xlsx'].includes(ext)) { fileIcon = 'fas fa-file-excel'; thumbClass = 'excel'; }
                else if (['ppt', 'pptx'].includes(ext)) { fileIcon = 'fas fa-file-powerpoint'; thumbClass = 'ppt'; }
                else if (['zip', 'rar', '7z'].includes(ext)) { fileIcon = 'fas fa-file-archive'; thumbClass = 'zip'; }
                else if (['mp3', 'wav', 'flac'].includes(ext)) { fileIcon = 'fas fa-file-audio'; thumbClass = 'audio'; }
                else if (['mp4', 'avi', 'mov'].includes(ext)) { fileIcon = 'fas fa-file-video'; thumbClass = 'video'; }
                else if (['js', 'css', 'html', 'php'].includes(ext)) { fileIcon = 'fas fa-file-code'; thumbClass = 'code'; }
                else if (['txt', 'md'].includes(ext)) { fileIcon = 'fas fa-file-alt'; thumbClass = 'text'; }

                // 构建下载链接
                let downloadUrl = `download.php?file=${encodeURIComponent(file.filename)}&password=${encodeURIComponent(currentPassword)}`;
                if (file.userDir) {
                    downloadUrl += `&userDir=${encodeURIComponent(file.userDir)}`;
                }

                div.innerHTML = `
                    <div class="file-grid-actions">
                        <button class="btn" onclick="previewFile('${file.filename}', ${file.userDir ? `'${file.userDir}'` : 'null'})" title="预览"><i class="fas fa-eye"></i></button>
                        <button class="btn" onclick="shareFile('${file.filename}', ${file.userDir ? `'${file.userDir}'` : 'null'})" title="分享"><i class="fas fa-share-alt"></i></button>
                        <a href="${downloadUrl}" class="btn" download="${file.name}" title="下载"><i class="fas fa-download"></i></a>
                        <button class="btn" onclick="deleteFile('${file.filename}', ${file.userDir ? `'${file.userDir}'` : 'null'})" title="删除"><i class="fas fa-trash-alt"></i></button>
                    </div>
                    <div class="file-grid-thumb ${thumbClass}"><i class="${fileIcon}"></i></div>
                    <div class="file-grid-name">${file.name}</div>
                    <div class="file-grid-meta">
                        <div>${formatFileSize(file.size)}</div>
                        <div>${formatDate(file.date)}</div>
                    </div>
                `;
                
                fileGridView.appendChild(div);
            });
        }

        // 切换文件选择
        function toggleFileSelection(filename) {
            const index = selectedFiles.indexOf(filename);
            if (index === -1) {
                selectedFiles.push(filename);
            } else {
                selectedFiles.splice(index, 1);
            }
        }

        // 全选文件
        function selectAllFiles() {
            const currentFiles = currentView === 'personal' ? files : publicFiles;
            selectedFiles = currentFiles.map(file => file.filename);
            // 更新复选框状态
            document.querySelectorAll('.file-checkbox').forEach(checkbox => {
                checkbox.checked = true;
            });
        }

        // 删除选中文件
        function deleteSelectedFiles() {
            if (selectedFiles.length === 0) {
                alert('请先选择要删除的文件');
                return;
            }
            
            if (confirm(`确定要删除选中的 ${selectedFiles.length} 个文件吗？`)) {
                // 批量删除文件
                const formData = new FormData();
                formData.append('action', 'delete');
                formData.append('password', currentPassword);
                
                // 添加所有选中的文件名
                selectedFiles.forEach(filename => {
                    formData.append('files[]', filename);
                });
                
                fetch('upload.php', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        refreshFileList();
                        showToast('文件删除成功');
                        selectedFiles = [];
                    } else {
                        alert('删除失败：' + data.message);
                    }
                })
                .catch(error => {
                    console.error('删除失败:', error);
                    alert('删除失败，请重试');
                });
            }
        }

        // 删除文件
        function deleteFile(filename, userDir = null) {
            if (confirm('确定要删除这个文件吗？')) {
                let body = `action=delete&file=${filename}&password=${encodeURIComponent(currentPassword)}`;
                if (isAdmin && userDir) {
                    body += `&userDir=${userDir}`;
                }
                
                fetch('upload.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: body
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        refreshFileList();
                        // 更新空间使用情况
                        if (data.usedSize) {
                            updateSpaceUsage(data);
                        }
                        // 显示成功提示
                        showToast('文件删除成功');
                    } else {
                        alert('删除失败：' + data.message);
                    }
                })
                .catch(error => {
                    console.error('删除失败:', error);
                    alert('删除失败，请重试');
                });
            }
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 格式化日期
        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            return date.toLocaleString('zh-CN');
        }

        // 显示提示
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-check-circle"></i> ${message}`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.transition = 'all 0.3s ease';
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(40px)';
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 300);
            }, 3000);
        }

        // 开始网络延迟检测
        function startNetworkPing() {
            function ping() {
                const startTime = performance.now();
                fetch('upload.php?action=ping')
                    .then(() => {
                        const endTime = performance.now();
                        const pingTime = Math.round(endTime - startTime);
                        pingValue.textContent = `${pingTime} ms`;
                        
                        // 更新网络状态颜色
                        networkStatus.className = 'network-status';
                        if (pingTime <= 100) {
                            networkStatus.classList.add('good');
                        } else if (pingTime <= 300) {
                            networkStatus.classList.add('warning');
                        } else {
                            networkStatus.classList.add('bad');
                        }
                    })
                    .catch(() => {
                        pingValue.textContent = '-- ms';
                        networkStatus.className = 'network-status bad';
                    });
            }
            
            // 初始检测
            ping();
            // 每3秒检测一次
            setInterval(ping, 3000);
        }

        // 预览文件
        function previewFile(filename, userDir = null) {
            const previewModal = document.getElementById('preview-modal');
            const previewContent = document.getElementById('preview-content');
            
            // 构建预览URL
            let previewUrl = `preview.php?file=${encodeURIComponent(filename)}&password=${encodeURIComponent(currentPassword)}`;
            if (userDir) {
                previewUrl += `&userDir=${encodeURIComponent(userDir)}`;
            }
            
            // 获取文件扩展名
            const fileExt = filename.split('.').pop().toLowerCase();
            
            // 根据文件类型生成预览内容
            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(fileExt)) {
                // 图片预览
                previewContent.innerHTML = `<img src="${previewUrl}" style="max-width: 100%; max-height: 70vh; object-fit: contain;">`;
            } else if (['mp4', 'avi', 'mov'].includes(fileExt)) {
                // 视频预览
                previewContent.innerHTML = `<video src="${previewUrl}" controls style="max-width: 100%; max-height: 70vh;"></video>`;
            } else if (['mp3', 'wav', 'flac'].includes(fileExt)) {
                // 音频预览
                previewContent.innerHTML = `<audio src="${previewUrl}" controls style="width: 100%;"></audio>`;
            } else if (fileExt === 'pdf') {
                // PDF预览
                previewContent.innerHTML = `<iframe src="${previewUrl}" style="width: 100%; height: 70vh;"></iframe>`;
            } else if (['txt', 'md', 'html', 'css', 'js'].includes(fileExt)) {
                // 文本预览
                fetch(previewUrl)
                    .then(response => response.text())
                    .then(text => {
                        previewContent.innerHTML = `<pre style="white-space: pre-wrap; word-wrap: break-word; max-height: 70vh; overflow: auto; padding: 15px; background-color: #f5f5f5; border-radius: 4px;">${text}</pre>`;
                    })
                    .catch(error => {
                        previewContent.innerHTML = '<p>预览失败，请下载查看</p>';
                    });
            } else {
                // 其他文件类型
                previewContent.innerHTML = '<p>该文件类型不支持预览，请下载查看</p>';
            }
            
            // 显示预览弹窗
            previewModal.classList.add('show');
        }

        // 关闭预览弹窗
        function closePreviewModal() {
            document.getElementById('preview-modal').classList.remove('show');
        }

        // 分享文件
        function shareFile(filename, userDir = null) {
            document.getElementById('share-file-name').value = filename;
            document.getElementById('share-user-dir').value = userDir || '';
            document.getElementById('share-url').value = '';
            document.getElementById('share-modal').classList.add('show');
        }

        // 关闭分享弹窗
        function closeShareModal() {
            document.getElementById('share-modal').classList.remove('show');
        }

        // 处理分享文件
        function handleShareFile(event) {
            event.preventDefault();
            const filename = document.getElementById('share-file-name').value;
            const userDir = document.getElementById('share-user-dir').value;
            const expiry = document.getElementById('share-expiry').value;
            
            fetch('share.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `action=create_share&password=${encodeURIComponent(currentPassword)}&file=${encodeURIComponent(filename)}&expiry=${expiry}&userDir=${encodeURIComponent(userDir)}`
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('share-url').value = data.shareUrl;
                    showToast('分享链接生成成功');
                } else {
                    alert('分享失败：' + data.message);
                }
            })
            .catch(error => {
                console.error('分享失败:', error);
                alert('分享失败，请重试');
            });
        }

        // 复制分享链接
        function copyShareUrl() {
            const shareUrl = document.getElementById('share-url');
            shareUrl.select();
            document.execCommand('copy');
            showToast('链接已复制到剪贴板');
        }

        // 初始化应用
        init();
    </script>
</body>
</html>
