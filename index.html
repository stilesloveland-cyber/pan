<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WPAN 个人网盘</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #19b955;
            --primary-dark: #14a34a;
            --primary-light: #e8f8ee;
            --primary-bg: #f0faf3;
            --bg: #f0f2f5;
            --bg-white: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #1a1a2e;
            --text-secondary: #555770;
            --text-muted: #8e90a6;
            --border: #e8e8ef;
            --border-light: #f2f2f7;
            --success: #19b955;
            --danger: #fa5151;
            --warning: #ff9500;
            --info: #5b8def;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.12);
            --radius: 8px;
            --radius-sm: 6px;
            --radius-lg: 12px;
            --radius-xl: 20px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --sidebar-width: 240px;
            --header-height: 60px;
            --gradient-start: #19b955;
            --gradient-end: #0f9d43;
            --modal-overlay: rgba(0,0,0,0.5);
            --login-bg: linear-gradient(135deg, #e8f8ee 0%, #f0faf3 50%, #d4edda 100%);
        }

        /* 暗色主题 */
        [data-theme="dark"] {
            --primary: #22c55e;
            --primary-dark: #16a34a;
            --primary-light: #1a3a2a;
            --primary-bg: #0d1f15;
            --bg: #0f0f1a;
            --bg-white: #1a1a2e;
            --bg-card: #1e1e36;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6b6b80;
            --border: #2a2a45;
            --border-light: #222238;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.4);
            --shadow-lg: 0 8px 40px rgba(0,0,0,0.5);
            --modal-overlay: rgba(0,0,0,0.7);
            --login-bg: linear-gradient(135deg, #0d1f15 0%, #1a1a2e 50%, #0f1923 100%);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #bbb; }

        .network-status {
            position: fixed;
            top: 12px;
            right: 16px;
            padding: 6px 14px;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: 50px;
            box-shadow: var(--shadow-sm);
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 1000;
        }
        .network-status i { font-size: 11px; }
        .network-status.good i { color: var(--success); }
        .network-status.warning i { color: var(--warning); }
        .network-status.bad i { color: var(--danger); }

        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--login-bg);
            padding: 20px;
        }

        .login-container {
            max-width: 420px;
            width: 100%;
            background: var(--bg-white);
            padding: 48px 40px 40px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            text-align: center;
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--border);
            backdrop-filter: blur(20px);
        }
        .login-container .logo {
            margin-bottom: 4px;
            position: relative;
        }
        .login-container .logo i {
            font-size: 52px;
            color: var(--primary);
            background: var(--primary-light);
            padding: 16px;
            border-radius: 50%;
            transition: var(--transition);
        }
        .login-container .logo i:hover {
            transform: scale(1.05) rotate(-5deg);
        }
        .login-container h1 {
            color: var(--text-primary);
            margin-bottom: 4px;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .login-container .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 32px;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-group {
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 13px;
            letter-spacing: 0.3px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            transition: var(--transition);
            background: var(--bg);
            color: var(--text-primary);
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-white);
            box-shadow: 0 0 0 4px rgba(25, 185, 85, 0.12);
        }
        .form-group input::placeholder {
            color: var(--text-muted);
        }

        .main-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-white);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 100;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-header {
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--border);
        }
        .sidebar-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 19px;
            font-weight: 700;
            color: var(--text-primary);
            text-decoration: none;
            letter-spacing: -0.3px;
        }
        .sidebar-header .logo i {
            color: var(--primary);
            font-size: 26px;
            background: var(--primary-light);
            padding: 6px;
            border-radius: var(--radius);
        }
        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 12px;
        }
        .sidebar-upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(25, 185, 85, 0.25);
        }
        .sidebar-upload-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(25, 185, 85, 0.35);
        }
        .sidebar-upload-btn:active {
            transform: translateY(0);
        }
        .sidebar-nav {
            list-style: none;
        }
        .sidebar-nav li {
            margin-bottom: 2px;
        }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
        }
        .sidebar-nav a i {
            width: 20px;
            text-align: center;
            font-size: 16px;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .sidebar-nav a:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .sidebar-nav a:hover i {
            color: var(--primary);
        }
        .sidebar-nav a.active {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }
        .sidebar-nav a.active i {
            color: var(--primary);
        }
        .sidebar-footer {
            padding: 16px 20px;
            border-top: 1px solid var(--border);
        }
        .sidebar-space-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .sidebar-space-bar {
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 6px;
        }
        .sidebar-space-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            border-radius: 3px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar-space-text {
            font-size: 11px;
            color: var(--text-muted);
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: var(--modal-overlay);
            z-index: 99;
            backdrop-filter: blur(2px);
        }
        .sidebar-overlay.show {
            display: block;
        }

        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .top-bar {
            background: var(--bg-white);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: var(--header-height);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        .top-bar-left h1 {
            font-size: 17px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .top-bar-left h1 i {
            color: var(--primary);
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: var(--text-secondary);
            padding: 4px 12px;
            background: var(--primary-light);
            border-radius: 50px;
        }
        .user-info i {
            color: var(--primary);
            font-size: 16px;
        }
        .admin-badge {
            padding: 2px 10px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .top-bar-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .content-body {
            padding: 24px 32px;
            flex: 1;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .toolbar-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .view-toggle {
            display: flex;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 3px;
            border: 1px solid var(--border);
        }
        .view-toggle button {
            padding: 6px 14px;
            border: none;
            background: transparent;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            border-radius: 4px;
            color: var(--text-muted);
            font-weight: 500;
        }
        .view-toggle button:hover {
            color: var(--text-secondary);
        }
        .view-toggle button.active {
            background: var(--bg-white);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }

        .sort-select {
            padding: 7px 14px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            background: var(--bg-white);
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .sort-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(25, 185, 85, 0.1);
        }

        .search-box {
            position: relative;
        }
        .search-box input {
            padding: 7px 14px 7px 36px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            transition: var(--transition);
            width: 180px;
            background: var(--bg);
            color: var(--text-primary);
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--bg-white);
            width: 240px;
            box-shadow: 0 0 0 3px rgba(25, 185, 85, 0.1);
        }
        .search-box input::placeholder {
            color: var(--text-muted);
        }
        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 13px;
            pointer-events: none;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 7px 16px;
            background: var(--bg-white);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: var(--transition);
            text-decoration: none;
            white-space: nowrap;
            user-select: none;
        }
        .btn:hover {
            border-color: #ccc;
            color: var(--text-primary);
            background: var(--bg);
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            border-color: transparent;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), var(--primary));
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 12px rgba(25, 185, 85, 0.3);
        }
        .btn-secondary {
            background: var(--bg);
            color: var(--text-secondary);
            border-color: transparent;
        }
        .btn-secondary:hover {
            background: var(--border);
            color: var(--text-primary);
        }
        .btn-danger {
            color: var(--danger);
            border-color: rgba(250, 81, 81, 0.2);
        }
        .btn-danger:hover {
            background: #fef2f2;
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-sm {
            padding: 5px 12px;
            font-size: 12px;
        }
        .btn-text {
            border: none;
            background: transparent;
            color: var(--text-secondary);
            padding: 5px 10px;
        }
        .btn-text:hover {
            background: var(--bg);
            color: var(--text-primary);
            transform: none;
        }
        .btn-text.btn-danger-text {
            color: var(--text-muted);
        }
        .btn-text.btn-danger-text:hover {
            background: #fef2f2;
            color: var(--danger);
        }

        .upload-area {
            background: var(--bg-card);
            border: 2px dashed var(--border);
            border-radius: var(--radius-lg);
            padding: 40px 24px;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .upload-area::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--primary-light), transparent);
            opacity: 0;
            transition: var(--transition);
        }
        .upload-area:hover::before {
            opacity: 1;
        }
        .upload-area:hover {
            border-color: var(--primary);
        }
        .upload-area.dragover {
            border-color: var(--primary);
            border-style: solid;
            background: var(--primary-light);
        }
        .upload-area.dragover::before {
            opacity: 1;
        }
        .upload-area .upload-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 16px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            position: relative;
        }
        .upload-area .upload-icon i {
            font-size: 28px;
            color: var(--primary);
        }
        .upload-area:hover .upload-icon {
            transform: scale(1.1) rotate(-5deg);
        }
        .upload-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: var(--text-primary);
            position: relative;
        }
        .upload-subtext {
            color: var(--text-muted);
            font-size: 13px;
            margin-bottom: 16px;
            position: relative;
        }
        .upload-options {
            display: flex;
            justify-content: center;
            gap: 10px;
            position: relative;
        }
        #file-input {
            display: none;
        }

        .files-section {
            background: var(--bg-white);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }
        .section-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-header h2 {
            font-size: 15px;
            font-weight: 600;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
        }
        .section-header h2 i {
            color: var(--primary);
        }
        .section-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .file-list-view {
            flex: 1;
            overflow-y: auto;
        }
        #file-list {
            list-style: none;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-light);
            transition: var(--transition);
            cursor: default;
            animation: fadeInUp 0.3s ease both;
        }
        .file-item:nth-child(1) { animation-delay: 0s; }
        .file-item:nth-child(2) { animation-delay: 0.04s; }
        .file-item:nth-child(3) { animation-delay: 0.08s; }
        .file-item:nth-child(4) { animation-delay: 0.12s; }
        .file-item:nth-child(5) { animation-delay: 0.16s; }
        .file-item:nth-child(n+6) { animation-delay: 0.2s; }
        .file-item:hover {
            background: var(--bg);
        }
        .file-item.selected {
            background: var(--primary-light);
        }

        .file-checkbox {
            margin-right: 14px;
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
            flex-shrink: 0;
        }

        .file-thumb {
            width: 40px;
            height: 40px;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            flex-shrink: 0;
            font-size: 22px;
        }
        .file-thumb.image { color: #10b981; background: #ecfdf5; }
        .file-thumb.pdf { color: #ef4444; background: #fef2f2; }
        .file-thumb.doc { color: #3b82f6; background: #eff6ff; }
        .file-thumb.excel { color: #10b981; background: #ecfdf5; }
        .file-thumb.ppt { color: #f59e0b; background: #fffbeb; }
        .file-thumb.zip { color: #8b5cf6; background: #f5f3ff; }
        .file-thumb.audio { color: #ec4899; background: #fdf2f8; }
        .file-thumb.video { color: #6366f1; background: #eef2ff; }
        .file-thumb.code { color: #14b8a6; background: #f0fdfa; }
        .file-thumb.text { color: #64748b; background: #f8fafc; }
        .file-thumb.default { color: var(--text-muted); background: var(--border); }

        .file-info {
            flex: 1;
            min-width: 0;
        }
        .file-name {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 2px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            gap: 12px;
        }
        .file-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .file-item:hover .file-actions {
            opacity: 1;
        }

        .file-grid-view {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }
        .file-grid-item {
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 12px 14px;
            text-align: center;
            transition: var(--transition);
            cursor: pointer;
            position: relative;
            animation: fadeInUp 0.3s ease both;
        }
        .file-grid-item:nth-child(1) { animation-delay: 0s; }
        .file-grid-item:nth-child(2) { animation-delay: 0.05s; }
        .file-grid-item:nth-child(3) { animation-delay: 0.1s; }
        .file-grid-item:nth-child(4) { animation-delay: 0.15s; }
        .file-grid-item:nth-child(n+5) { animation-delay: 0.2s; }
        .file-grid-item:hover {
            border-color: #ddd;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .file-grid-item.selected {
            border-color: var(--primary);
            background: var(--primary-light);
        }
        .file-grid-thumb {
            width: 56px;
            height: 56px;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius);
            font-size: 28px;
        }
        .file-grid-thumb.image { color: #10b981; background: #ecfdf5; }
        .file-grid-thumb.pdf { color: #ef4444; background: #fef2f2; }
        .file-grid-thumb.doc { color: #3b82f6; background: #eff6ff; }
        .file-grid-thumb.excel { color: #10b981; background: #ecfdf5; }
        .file-grid-thumb.ppt { color: #f59e0b; background: #fffbeb; }
        .file-grid-thumb.zip { color: #8b5cf6; background: #f5f3ff; }
        .file-grid-thumb.audio { color: #ec4899; background: #fdf2f8; }
        .file-grid-thumb.video { color: #6366f1; background: #eef2ff; }
        .file-grid-thumb.code { color: #14b8a6; background: #f0fdfa; }
        .file-grid-thumb.text { color: #64748b; background: #f8fafc; }
        .file-grid-thumb.default { color: var(--text-muted); background: var(--border); }
        .file-grid-name {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-grid-meta {
            font-size: 11px;
            color: var(--text-muted);
        }
        .file-grid-actions {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            gap: 2px;
            opacity: 0;
            transition: var(--transition);
        }
        .file-grid-item:hover .file-grid-actions {
            opacity: 1;
        }
        .file-grid-actions .btn {
            padding: 3px 6px;
            font-size: 11px;
            background: rgba(255,255,255,0.9);
            border: 1px solid var(--border);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state i {
            font-size: 48px;
            margin-bottom: 12px;
            color: #ddd;
        }
        .empty-state h3 {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }
        .empty-state p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 16px;
            overflow: hidden;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
            position: relative;
        }
        .progress-fill::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 1.2s infinite;
        }
        .progress-fill::after {
            content: attr(data-speed);
            position: absolute;
            top: 10px;
            right: 0;
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            font-weight: 500;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-overlay);
            z-index: 1000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.2s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal.show { display: flex; }
        .modal-content {
            background: var(--bg-white);
            padding: 28px 32px;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-lg);
            width: 90%;
            max-width: 420px;
            animation: scaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border: 1px solid var(--border);
        }
        .modal-content.large {
            max-width: 760px;
            max-height: 80vh;
            overflow: hidden;
        }
        .modal-content.large .modal-body {
            max-height: calc(80vh - 130px);
            overflow: auto;
        }
        .modal-header {
            margin-bottom: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .modal-close {
            background: transparent;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: var(--bg);
            color: var(--text-primary);
        }
        .modal-body { margin-bottom: 18px; }
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .toast {
            position: fixed;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 28px;
            background: var(--text-primary);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            z-index: 10000;
            animation: toastIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .toast i {
            color: var(--success);
            font-size: 18px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
        @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(-16px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        @media (max-width: 1200px) {
            .file-grid-view { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
        }

        @media (max-width: 768px) {
            :root {
                --sidebar-width: 0px;
            }
            .sidebar {
                width: 240px;
                transform: translateX(-100%);
                box-shadow: var(--shadow-lg);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar.open ~ .sidebar-overlay {
                display: block;
            }
            .main-content { margin-left: 0; }
            .top-bar { padding: 0 16px; }
            .top-bar-left h1 { font-size: 15px; }
            .user-info { font-size: 12px; padding: 3px 10px; }
            .content-body { padding: 16px; }
            .toolbar { flex-direction: column; align-items: flex-start; }
            .toolbar-left, .toolbar-right { width: 100%; }
            .toolbar-right { justify-content: flex-end; }
            .upload-area { padding: 28px 16px; }
            .upload-area .upload-icon { width: 52px; height: 52px; }
            .upload-area .upload-icon i { font-size: 22px; }
            .file-item { padding: 10px 14px; }
            .file-actions { opacity: 1; }
            .file-grid-view { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
            .file-grid-item { padding: 14px 8px; }
            .file-grid-thumb { width: 44px; height: 44px; font-size: 22px; }
            .search-box input { width: 120px; }
            .search-box input:focus { width: 160px; }
            .network-status { display: none; }
            .login-container { padding: 36px 24px; border-radius: var(--radius-lg); }
        }

        @media (max-width: 480px) {
            .login-wrapper { padding: 12px; }
            .login-container { padding: 28px 20px; border-radius: var(--radius-lg); margin: 0; }
            .login-container h1 { font-size: 20px; }
            .login-container .logo i { font-size: 40px; padding: 12px; }
            .content-body { padding: 12px; }
            .file-grid-view { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
            .file-grid-item { padding: 12px 6px; }
            .file-grid-thumb { width: 38px; height: 38px; font-size: 18px; }
            .modal-content { padding: 24px 20px; }
        }
    </style>
</head>
<body>
    <!-- 网络延迟显示 -->
    <div class="network-status" id="network-status">
        <i class="fas fa-wifi"></i>
        <span id="ping-value">-- ms</span>
    </div>

    <!-- 登录界面 -->
    <div id="login-container" class="login-wrapper">
        <div class="login-container">
            <div class="logo"><i class="fas fa-cloud-upload-alt"></i></div>
            <h1>WPAN 网盘</h1>
            <p class="subtitle">输入密码访问你的个人云存储</p>
            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="login-password">登录密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 15px;">
                    <i class="fas fa-sign-in-alt"></i> 登录
                </button>
            </form>
            <div style="margin-top: 24px; text-align: center;">
                <span style="color: var(--text-muted); font-size: 14px;">还没有账号？</span>
                <button class="btn btn-text" onclick="showRegisterModal()" style="width: 100%; margin-top: 8px; justify-content: center; color: var(--primary); font-weight: 600;">
                    <i class="fas fa-user-plus"></i> 立即注册
                </button>
            </div>
        </div>
    </div>

    <!-- 注册弹窗 -->
    <div id="register-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>注册账号</h2>
                <button class="modal-close" onclick="closeRegisterModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleRegister(event)">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="register-password">密码</label>
                        <input type="password" id="register-password" required style="width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: var(--radius);">
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="confirm-password">确认密码</label>
                        <input type="password" id="confirm-password" required style="width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: var(--radius);">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeRegisterModal()">取消</button>
                        <button type="submit" class="btn">注册</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 主界面 -->
    <div id="main-container" style="display: none;">
        <div class="main-layout">
            <!-- 侧边栏 -->
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <a href="#" class="logo">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span>百度网盘</span>
                    </a>
                </div>
                <div class="sidebar-body">
                    <button class="sidebar-upload-btn" onclick="document.getElementById('file-input').click()">
                        <i class="fas fa-cloud-arrow-up"></i> 上传文件
                    </button>
                    <ul class="sidebar-nav" id="sidebar-nav">
                        <li><a href="#" class="active" data-view="personal"><i class="fas fa-folder"></i> 个人文件</a></li>
                        <li><a href="#" data-view="public"><i class="fas fa-users"></i> 公共空间</a></li>
                    </ul>
                </div>
                <div class="sidebar-footer">
                    <div class="sidebar-space-label">空间使用</div>
                    <div class="sidebar-space-bar">
                        <div id="sidebar-space-fill" class="sidebar-space-fill" style="width: 0%"></div>
                    </div>
                    <div class="sidebar-space-text" id="sidebar-space-text">0 MB / 2 GB</div>
                    <div style="display: flex; gap: 6px; margin-top: 12px;">
                        <button class="btn btn-sm" onclick="toggleDarkMode()" style="flex:1;" title="切换主题">
                            <i class="fas fa-moon" id="theme-icon"></i>
                        </button>
                        <button class="btn btn-sm btn-danger" onclick="handleLogout()" style="flex:1;" title="退出登录">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 移动端侧边栏遮罩 -->
            <div class="sidebar-overlay" onclick="toggleSidebar()"></div>

            <!-- 主内容区 -->
            <div class="main-content">
                <!-- 顶部操作栏 -->
                <div class="top-bar">
                    <div class="top-bar-left">
                        <button class="btn btn-text" onclick="toggleSidebar()" style="display:none;padding:6px 10px;font-size:18px" id="menu-toggle" title="菜单">
                            <i class="fas fa-bars"></i>
                        </button>
                        <h1><i class="fas fa-folder-open"></i> <span id="section-title">个人文件</span></h1>
                        <span class="user-info">
                            <i class="fas fa-user-circle"></i>
                            <span id="user-id">用户</span>
                            <span id="admin-badge" class="admin-badge" style="display: none;">管理员</span>
                        </span>
                    </div>
                    <div class="top-bar-right">
                        <button class="btn btn-text" onclick="showChangePassword()" title="修改密码">
                            <i class="fas fa-key"></i>
                        </button>
                        <button class="btn btn-text" onclick="showLogin()" title="切换用户">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </div>
                </div>

                <div class="content-body">
                    <!-- 工具栏 -->
                    <div class="toolbar">
                        <div class="toolbar-left">
                            <div class="view-toggle">
                                <button class="active" data-view="list"><i class="fas fa-list"></i> 列表</button>
                                <button data-view="grid"><i class="fas fa-th-large"></i> 图标</button>
                            </div>
                            <select id="sort-select" class="sort-select" onchange="sortFiles()">
                                <option value="date-desc">按时间排序（最新优先）</option>
                                <option value="date-asc">按时间排序（最早优先）</option>
                                <option value="size-desc">按大小排序（从大到小）</option>
                                <option value="size-asc">按大小排序（从小到大）</option>
                                <option value="name-asc">按名称排序（A-Z）</option>
                                <option value="name-desc">按名称排序（Z-A）</option>
                            </select>
                        </div>
                        <div class="toolbar-right">
                            <div class="search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" id="search-input" placeholder="搜索文件..." onkeyup="searchFiles()">
                            </div>
                            <button class="btn btn-sm" onclick="selectAllFiles()">
                                <i class="fas fa-check-square"></i> 全选
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteSelectedFiles()">
                                <i class="fas fa-trash-alt"></i> 删除
                            </button>
                        </div>
                    </div>

                    <!-- 上传区域 -->
                    <div class="upload-area" id="upload-area">
                        <div class="upload-icon"><i class="fas fa-cloud-arrow-up"></i></div>
                        <div class="upload-text">拖拽文件到此处或点击上传</div>
                        <div class="upload-subtext">支持所有文件类型，单文件最大 10GB</div>
                        <input type="file" id="file-input" multiple>
                        <div class="upload-options">
                            <button class="btn btn-primary" onclick="document.getElementById('file-input').click()">
                                <i class="fas fa-folder-open"></i> 选择文件
                            </button>
                            <button class="btn" onclick="uploadToPublic()">
                                <i class="fas fa-users"></i> 上传到公共空间
                            </button>
                        </div>
                        <div class="progress-bar" id="progress-bar">
                            <div class="progress-fill" id="progress-fill"></div>
                        </div>
                    </div>

                    <!-- 文件列表区域 -->
                    <div class="files-section">
                        <div class="section-header">
                            <h2><i class="fas fa-folder-open"></i> 全部文件</h2>
                        </div>
                        <div class="file-list-view" id="file-list-view">
                            <ul id="file-list">
                                <!-- 文件列表将通过JavaScript动态生成 -->
                            </ul>
                        </div>
                        <div class="file-grid-view" id="file-grid-view" style="display: none;">
                            <!-- 图标视图将通过JavaScript动态生成 -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 密码修改弹窗 -->
    <div id="change-password-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>修改密码</h2>
                <button class="modal-close" onclick="closeChangePasswordModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleChangePassword(event)">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="current-password">当前密码</label>
                        <input type="password" id="current-password" required style="width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: var(--radius);">
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="new-password">新密码</label>
                        <input type="password" id="new-password" required style="width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: var(--radius);">
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeChangePasswordModal()">取消</button>
                        <button type="submit" class="btn">确认修改</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- 预览弹窗 -->
    <div id="preview-modal" class="modal">
        <div class="modal-content large">
            <div class="modal-header">
                <h2>文件预览</h2>
                <button class="modal-close" onclick="closePreviewModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="preview-content" style="width: 100%;">
                    <!-- 预览内容将通过JavaScript动态生成 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 分享弹窗 -->
    <div id="share-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>分享文件</h2>
                <button class="modal-close" onclick="closeShareModal()">&times;</button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleShareFile(event)">
                    <input type="hidden" id="share-file-name">
                    <input type="hidden" id="share-user-dir">
                    <div class="form-group" style="margin-bottom: 15px;">
                        <label for="share-expiry">有效期</label>
                        <select id="share-expiry" required style="width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: var(--radius);">
                            <option value="1">1天</option>
                            <option value="7">7天</option>
                            <option value="30">30天</option>
                        </select>
                    </div>
                    <div class="form-group" style="margin-bottom: 20px;">
                        <label for="share-url">分享链接</label>
                        <input type="text" id="share-url" readonly style="width: 100%; padding: 10px; border: 2px solid var(--border); border-radius: var(--radius);">
                        <button type="button" class="btn btn-sm" onclick="copyShareUrl()" style="margin-top: 10px;">复制链接</button>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" onclick="closeShareModal()">取消</button>
                        <button type="submit" class="btn">生成链接</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 全局变量
        let currentPassword = '';
        let files = [];
        let publicFiles = [];
        let currentView = 'personal'; // personal or public
        let displayView = 'list'; // list or grid
        let selectedFiles = [];
        let usedSize = 0;
        let maxSize = 2 * 1024 * 1024 * 1024; // 2GB
        let globalUsedSize = 0;
        let globalMaxSize = 10 * 1024 * 1024 * 1024; // 10GB
        let publicUsedSize = 0;
        let publicMaxSize = 5 * 1024 * 1024 * 1024; // 5GB
        let isAdmin = false;
        let isLoggedIn = false;

        // DOM元素
        const loginContainer = document.getElementById('login-container');
        const mainContainer = document.getElementById('main-container');
        const loginPassword = document.getElementById('login-password');
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const fileList = document.getElementById('file-list');
        const fileListView = document.getElementById('file-list-view');
        const fileGridView = document.getElementById('file-grid-view');
        const progressBar = document.getElementById('progress-bar');
        const progressFill = document.getElementById('progress-fill');
        const changePasswordModal = document.getElementById('change-password-modal');
        const networkStatus = document.getElementById('network-status');
        const pingValue = document.getElementById('ping-value');

        // ========== 暗色模式 ==========
        function getPreferredTheme() {
            const saved = localStorage.getItem('wpanTheme');
            if (saved) return saved;
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('wpanTheme', theme);
            const icon = document.getElementById('theme-icon');
            if (icon) {
                icon.className = theme === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
            }
        }

        function toggleDarkMode() {
            const current = document.documentElement.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        // 初始化主题
        applyTheme(getPreferredTheme());

        // ========== 移动端侧边栏 ==========
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            sidebar.classList.toggle('open');
            if (overlay) overlay.classList.toggle('show');
        }

        // ========== 初始化 ==========
        function init() {
            // 先尝试用 session 恢复登录
            checkSession().then(loggedIn => {
                if (loggedIn) {
                    showMain();
                    refreshFileList();
                } else {
                    showLogin();
                }
            }).catch(() => {
                showLogin();
            });
            
            // 初始化拖拽上传
            initDragAndDrop();
            
            // 初始化文件输入
            initFileInput();
            
            // 初始化视图切换
            initViewToggle();
            
            // 初始化侧边栏导航

        // 检查服务端会话
        async function checkSession() {
            try {
                const response = await fetch('upload.php?action=ping', { cache: 'no-store' });
                if (!response.ok) return false;
                // 再尝试获取文件列表验证会话
                const fileResp = await fetch('files.php', { cache: 'no-store' });
                const data = await fileResp.json();
                if (data.success) {
                    isLoggedIn = true;
                    isAdmin = data.admin || false;
                    files = data.files || [];
                    publicFiles = data.publicFiles || [];
                    updateSpaceUsage(data);
                    return true;
                }
            } catch (e) {}
            return false;
        }

        // 上传文件
        function uploadFiles(fileList, isPublic = false) {
            if (fileInput.dataset.isPublic === 'true') {
                isPublic = true;
                fileInput.dataset.isPublic = 'false';
            }

            const formData = new FormData();
            
            for (let i = 0; i < fileList.length; i++) {
                formData.append('files[]', fileList[i]);
            }
            
            formData.append('is_public', isPublic);
            if (currentPassword) {
                formData.append('password', currentPassword);
            }

            // 显示进度条
            progressBar.style.display = 'block';
            progressFill.style.width = '0%';
            progressFill.removeAttribute('data-speed');

            // 计算总文件大小
            let totalSize = 0;
            for (let i = 0; i < fileList.length; i++) {
                totalSize += fileList[i].size;
            }

            // 上传开始时间
            const startTime = Date.now();
            let uploadedSize = 0;

            // 使用XMLHttpRequest实现实时进度
            const xhr = new XMLHttpRequest();

            xhr.upload.addEventListener('progress', function(e) {
                if (e.lengthComputable) {
                    uploadedSize = e.loaded;
                    const progress = (uploadedSize / totalSize) * 100;
                    progressFill.style.width = `${Math.min(progress, 100)}%`;

                    // 计算上传速度
                    const elapsedTime = (Date.now() - startTime) / 1000;
                    if (elapsedTime > 0) {
                        const speed = uploadedSize / elapsedTime;
                        const speedText = formatFileSize(speed) + '/s';
                        progressFill.setAttribute('data-speed', speedText);
                    }
                }
            });

            xhr.addEventListener('load', function() {
                progressBar.style.display = 'none';
                try {
                    const data = JSON.parse(xhr.responseText);
                    if (data.success) {
                        refreshFileList();
                        if (data.usedSize !== undefined) {
                            updateSpaceUsage(data);
                        }
                        showToast('文件上传成功');
                    } else {
                        alert('上传失败：' + (data.message || '未知错误'));
                    }
                } catch (error) {
                    alert('上传失败，请重试');
                }
            });

            xhr.addEventListener('error', function() {
                alert('上传失败，请重试');
                progressBar.style.display = 'none';
            });

            xhr.open('POST', 'upload.php');
            xhr.send(formData);
        }

        // 刷新文件列表
        function refreshFileList() {
            let url = 'files.php';
            if (currentPassword) {
                url += `?password=${encodeURIComponent(currentPassword)}`;
            }
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        files = data.files || [];
                        publicFiles = data.publicFiles || [];
                        isAdmin = data.admin || isAdmin;
                        updateSpaceUsage(data);
                        renderFiles();
                    } else if (data.message && data.message.includes('登录')) {
                        showLogin();
                    }
                })
                .catch(error => {
                    console.error('获取文件列表失败:', error);
                });
        }

        // 更新空间使用情况
        function updateSpaceUsage(data) {
            usedSize = data.usedSize || 0;
            maxSize = data.maxSize || 2 * 1024 * 1024 * 1024;
            globalUsedSize = data.globalUsedSize || 0;
            globalMaxSize = data.globalMaxSize || 10 * 1024 * 1024 * 1024;
            publicUsedSize = data.publicUsedSize || 0;
            publicMaxSize = data.publicMaxSize || 5 * 1024 * 1024 * 1024;
            updateSpaceDisplay();
        }

            sidebarLinks.forEach(link => {

        // 单独更新空间显示（不请求服务器）
        function updateSpaceDisplay() {
            const sidebarSpaceFill = document.getElementById('sidebar-space-fill');
            const sidebarSpaceText = document.getElementById('sidebar-space-text');
            const sidebarSpaceLabel = document.querySelector('.sidebar-space-label');

            let displaySize, displayMax;
            if (currentView === 'public') {
                displaySize = publicUsedSize;
                displayMax = publicMaxSize;
                if (sidebarSpaceLabel) sidebarSpaceLabel.textContent = '公共空间';
            } else {
                displaySize = usedSize;
                displayMax = maxSize;
                if (sidebarSpaceLabel) sidebarSpaceLabel.textContent = '个人空间';
            }

            const percentage = Math.min((displaySize / displayMax) * 100, 100);
            sidebarSpaceFill.style.width = `${percentage}%`;
            sidebarSpaceText.textContent = `${formatFileSize(displaySize)} / ${formatFileSize(displayMax)}`;
        }

        // 排序文件
        function sortFiles() {
            const sortValue = document.getElementById('sort-select').value;
            const currentFiles = currentView === 'personal' ? files : publicFiles;
            
            switch (sortValue) {
                case 'date-desc':
                    currentFiles.sort((a, b) => b.date - a.date);
                    break;
                case 'date-asc':
                    currentFiles.sort((a, b) => a.date - b.date);
                    break;
                case 'size-desc':
                    currentFiles.sort((a, b) => b.size - a.size);
                    break;
                case 'size-asc':
                    currentFiles.sort((a, b) => a.size - b.size);
                    break;
                case 'name-asc':
                    currentFiles.sort((a, b) => a.name.localeCompare(b.name));
                    break;
                case 'name-desc':
                    currentFiles.sort((a, b) => b.name.localeCompare(a.name));
                    break;
            }
            
            renderFiles();
        }

        // 搜索文件
        function searchFiles() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const currentFiles = currentView === 'personal' ? files : publicFiles;
            const filteredFiles = currentFiles.filter(file => 
                file.name.toLowerCase().includes(searchTerm)
            );
            renderFiles(filteredFiles);
        }

        // 切换文件选择
        function toggleFileSelection(filename) {
            const index = selectedFiles.indexOf(filename);
            if (index === -1) {
                selectedFiles.push(filename);
            } else {
                selectedFiles.splice(index, 1);
            }
        }

        // 全选文件
        function selectAllFiles() {
            const currentFiles = currentView === 'personal' ? files : publicFiles;
            selectedFiles = currentFiles.map(file => file.filename);
            // 更新复选框状态
            document.querySelectorAll('.file-checkbox').forEach(checkbox => {
                checkbox.checked = true;
            });

        // 删除选中文件
        function deleteSelectedFiles() {
            if (selectedFiles.length === 0) {
                alert('请先选择要删除的文件');
                return;
            }
            
            if (!confirm(`确定要删除选中的 ${selectedFiles.length} 个文件吗？`)) return;

            const formData = new FormData();
            formData.append('action', 'delete');
            if (currentPassword) formData.append('password', currentPassword);
            
            // 判断是否在公共空间视图
            if (currentView === 'public') {
                formData.append('is_public', 'true');
            }
            
            selectedFiles.forEach(filename => {
                formData.append('files[]', filename);
            });
            
            fetch('upload.php', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    refreshFileList();
                    showToast(data.message || '删除成功');
                    selectedFiles = [];
                } else {
                    alert('删除失败：' + data.message);
                }
            })
            .catch(error => {
                console.error('删除失败:', error);
                alert('删除失败，请重试');
            });
        }

        // 删除单个文件
        function deleteFile(filename, userDir = null) {
            if (!confirm('确定要删除这个文件吗？')) return;
            
            let body = `action=delete&file=${encodeURIComponent(filename)}`;
            if (currentPassword) body += `&password=${encodeURIComponent(currentPassword)}`;
            if (isAdmin && userDir) body += `&userDir=${encodeURIComponent(userDir)}`;
            if (currentView === 'public') body += '&is_public=true';
            
            fetch('upload.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: body
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    refreshFileList();
                    if (data.usedSize !== undefined) {
                        updateSpaceUsage(data);
                    }
                    showToast('文件删除成功');
                } else {
                    alert('删除失败：' + data.message);
                }
            })
            .catch(error => {
                console.error('删除失败:', error);
                alert('删除失败，请重试');
            });
        }

        // HTML转义
        function escHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        // 格式化日期
        function formatDate(timestamp) {
            const date = new Date(timestamp * 1000);
            const now = new Date();
            const diff = now - date;
            const oneDay = 86400000;
            
            if (diff < oneDay) {
                return '今天 ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            } else if (diff < 2 * oneDay) {
                return '昨天 ' + date.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            } else {
                return date.toLocaleString('zh-CN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
            }
        }

        // 显示提示
        function showToast(message, isError = false) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();

            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas ${isError ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> ${escHtml(message)}`;
            if (isError) {
                toast.style.background = 'var(--danger)';
            }
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.transition = 'all 0.3s ease';
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(-50%) translateY(-20px)';
                setTimeout(() => {
                    if (toast.parentNode) toast.remove();
                }, 300);
            }, 3000);
        }

        // 开始网络延迟检测
        function startNetworkPing() {
            function ping() {
                const startTime = performance.now();
                fetch('upload.php?action=ping')
                    .then(() => {
                        const endTime = performance.now();
                        const pingTime = Math.round(endTime - startTime);
                        pingValue.textContent = `${pingTime} ms`;
                        
                        networkStatus.className = 'network-status';
                        if (pingTime <= 100) {
                            networkStatus.classList.add('good');
                        } else if (pingTime <= 300) {
                            networkStatus.classList.add('warning');
                        } else {
                            networkStatus.classList.add('bad');
                        }
                    })
                    .catch(() => {
                        pingValue.textContent = '-- ms';
                        networkStatus.className = 'network-status bad';
                    });
            }
            
            ping();
            setInterval(ping, 3000);
        }

        // ========== 预览文件 ==========
        function previewFile(filename, userDir = null) {
            const previewModal = document.getElementById('preview-modal');
            const previewContent = document.getElementById('preview-content');
            
            // 构建预览URL（Session优先，密码备选）
            let previewUrl = `preview.php?file=${encodeURIComponent(filename)}`;
            if (userDir) previewUrl += `&userDir=${encodeURIComponent(userDir)}`;
            if (currentPassword) previewUrl += `&password=${encodeURIComponent(currentPassword)}`;
            
            const fileExt = filename.split('.').pop().toLowerCase();
            
            const imageExts = ['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg'];
            const videoExts = ['mp4', 'webm', 'avi', 'mov'];
            const audioExts = ['mp3', 'wav', 'flac', 'ogg', 'aac'];
            const textExts = ['txt', 'md', 'html', 'css', 'js', 'json', 'xml', 'php', 'log', 'yaml', 'yml', 'conf', 'ini'];
            
            previewContent.innerHTML = '<div style="text-align:center;padding:40px"><i class="fas fa-spinner fa-pulse" style="font-size:32px;color:var(--text-muted)"></i><p style="margin-top:12px;color:var(--text-muted)">加载中...</p></div>';
            previewModal.classList.add('show');
            
            if (imageExts.includes(fileExt)) {
                previewContent.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;min-height:200px"><img src="${previewUrl}" style="max-width: 100%; max-height: 70vh; object-fit: contain; border-radius: 8px;"></div>`;
            } else if (videoExts.includes(fileExt)) {
                previewContent.innerHTML = `<video src="${previewUrl}" controls style="max-width: 100%; max-height: 70vh; border-radius: 8px;"></video>`;
            } else if (audioExts.includes(fileExt)) {
                previewContent.innerHTML = `<div style="padding:40px;text-align:center"><i class="fas fa-file-audio" style="font-size:64px;color:var(--primary);margin-bottom:20px"></i><br><audio src="${previewUrl}" controls style="width: 100%;"></audio></div>`;
            } else if (fileExt === 'pdf') {
                previewContent.innerHTML = `<iframe src="${previewUrl}" style="width: 100%; height: 70vh; border: none; border-radius: 8px;"></iframe>`;
            } else if (textExts.includes(fileExt)) {
                fetch(previewUrl)
                    .then(response => {
                        if (!response.ok) throw new Error('预览失败');
                        return response.text();
                    })
                    .then(text => {
                        const escaped = escHtml(text);
                        previewContent.innerHTML = `<pre style="white-space: pre-wrap; word-wrap: break-word; max-height: 70vh; overflow: auto; padding: 20px; background: var(--bg); border-radius: 8px; font-size: 13px; line-height: 1.7; margin:0"><code>${escaped}</code></pre>`;
                    })
                    .catch(() => {
                        previewContent.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted)"><i class="fas fa-exclamation-circle" style="font-size:48px;color:var(--warning);margin-bottom:12px"></i><p>预览失败，请下载查看</p></div>';
                    });
            } else {
                previewContent.innerHTML = `<div style="text-align:center;padding:60px 20px;color:var(--text-muted)"><i class="fas fa-file" style="font-size:56px;margin-bottom:16px;color:var(--border)"></i><p>该文件类型暂不支持在线预览</p><p style="font-size:13px;margin-top:8px">请下载后使用本地应用查看</p></div>`;
            }
        }

        // 关闭预览弹窗
        function closePreviewModal() {
            document.getElementById('preview-modal').classList.remove('show');
            document.getElementById('preview-content').innerHTML = '';
        }

        // ========== 分享文件 ==========
        function shareFile(filename, userDir = null) {
            document.getElementById('share-file-name').value = filename;
            document.getElementById('share-user-dir').value = userDir || '';
            document.getElementById('share-url').value = '';
            document.getElementById('share-modal').classList.add('show');
        }

        function closeShareModal() {
            document.getElementById('share-modal').classList.remove('show');
        }

        function handleShareFile(event) {
            event.preventDefault();
            const filename = document.getElementById('share-file-name').value;
            const userDir = document.getElementById('share-user-dir').value;
            const expiry = document.getElementById('share-expiry').value;
            
            let body = `action=create_share&file=${encodeURIComponent(filename)}&expiry=${expiry}&userDir=${encodeURIComponent(userDir)}`;
            if (currentPassword) body += `&password=${encodeURIComponent(currentPassword)}`;
            
            fetch('share.php', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: body
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('share-url').value = data.shareUrl;
                    showToast('分享链接生成成功');
                } else {
                    alert('分享失败：' + data.message);
                }
            })
            .catch(error => {
                console.error('分享失败:', error);
                alert('分享失败，请重试');
            });
        }

        function copyShareUrl() {
            const shareUrl = document.getElementById('share-url');
            if (!shareUrl.value) {
                showToast('请先生成分享链接', true);
                return;
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl.value).then(() => {
                    showToast('链接已复制到剪贴板');
                }).catch(() => {
                    fallbackCopy();
                });
            } else {
                fallbackCopy();
            }
        }

        function fallbackCopy() {
            const shareUrl = document.getElementById('share-url');
            shareUrl.select();
            document.execCommand('copy');
            showToast('链接已复制到剪贴板');
        }

        // 初始化应用
        init();
    </script>
</body>
</html>
