server {
    listen 80;
    server_name localhost;

    root /var/www/html/pan;
    index index.html index.php;

    client_max_body_size 10G;
    client_body_buffer_size 8M;
    client_body_timeout 600s;
    keepalive_timeout 120s;
    keepalive_requests 1000;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location /protected-uploads {
        internal;
        alias /var/www/uploads;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PHP_VALUE "upload_max_filesize=10G\npost_max_size=10G\nmax_execution_time=300\nmax_input_time=300";
        fastcgi_intercept_errors on;
        include fastcgi_params;
    }

    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* /fix_users\.php$ {
        deny all;
    }
}
