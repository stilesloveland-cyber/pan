<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网盘管理后台</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4a90e2',
                        secondary: '#6c757d',
                        success: '#2ecc71',
                        danger: '#e74c3c',
                        warning: '#f39c12',
                        info: '#3498db',
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                },
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .content-auto {
                content-visibility: auto;
            }
            .transition-all-300 {
                transition: all 300ms ease-in-out;
            }
            .scrollbar-hide {
                -ms-overflow-style: none;
                scrollbar-width: none;
            }
            .scrollbar-hide::-webkit-scrollbar {
                display: none;
            }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen">
    <div class="container mx-auto px-4 py-6">
        <!-- 顶部导航 -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-4 mb-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <h1 class="text-2xl font-bold text-primary flex items-center gap-2">
                        <i class="fas fa-cogs"></i>
                        <span>管理后台</span>
                    </h1>
                </div>
                <div class="flex items-center gap-3">
                    <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors flex items-center gap-2" onclick="backToMain()">
                        <i class="fas fa-arrow-left"></i>
                        <span>返回主站</span>
                    </button>
                    <button class="px-4 py-2 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors flex items-center gap-2" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>退出登录</span>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- 导航标签页 -->
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-1 mb-6">
            <div class="flex flex-wrap gap-1">
                <button class="tab-btn active px-4 py-2 rounded-lg bg-primary text-white transition-colors" data-tab="users">
                    <i class="fas fa-users mr-2"></i>用户管理
                </button>
                <button class="tab-btn px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" data-tab="space">
                    <i class="fas fa-hdd mr-2"></i>空间管理
                </button>
                <button class="tab-btn px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" data-tab="logs">
                    <i class="fas fa-history mr-2"></i>操作日志
                </button>
                <button class="tab-btn px-4 py-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" data-tab="announcements">
                    <i class="fas fa-bullhorn mr-2"></i>公告管理
                </button>
            </div>
        </div>
        
        <!-- 内容区域 -->
        <div class="tab-content">
            <!-- 用户管理 -->
            <div id="users-tab" class="tab-pane active">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white">用户管理</h2>
                        <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors flex items-center gap-2" onclick="showAddUserModal()">
                            <i class="fas fa-plus"></i>
                            <span>添加用户</span>
                        </button>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="border-b border-gray-200 dark:border-gray-700">
                                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 dark:text-gray-400">用户ID</th>
                                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 dark:text-gray-400">角色</th>
                                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 dark:text-gray-400">空间使用</th>
                                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 dark:text-gray-400">操作</th>
                                </tr>
                            </thead>
                            <tbody id="users-table-body">
                                <!-- 用户列表将通过JavaScript动态生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- 空间管理 -->
            <div id="space-tab" class="tab-pane hidden">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6">
                    <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-6">空间管理</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div class="bg-gray-50 dark:bg-gray-700/50 rounded-lg p-4">
                            <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">全局空间</h3>
                            <div class="text-3xl font-bold text-primary mb-2" id="global-space">0 MB / 10 GB</div>
                            <div class="w-full bg-gray-200 dark:bg-gray-600 rounded-full h-2.5 mb-2">
                                <div id="global-space-bar" class="bg-primary h-2.5 rounded-full" style="width: 0%"></div>
                            </div>
                            <div class="text-sm text-gray-500 dark:text-gray-400">
                                总空间: <span id="total-space">10 GB</span>
                            </div>
                        </div>
                        <div class="bg-gray-50 dark:bg-gray-700/50 rounded-lg p-4">
                            <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">私人空间</h3>
                            <div class="text-3xl font-bold text-warning mb-2" id="personal-space">0 MB / 2 GB</div>
                            <div class="w-full bg-gray-200 dark:bg-gray-600 rounded-full h-2.5 mb-2">
                                <div id="personal-space-bar" class="bg-warning h-2.5 rounded-full" style="width: 0%"></div>
                            </div>
                            <div class="text-sm text-gray-500 dark:text-gray-400">
                                每用户配额: <span id="personal-quota">2 GB</span>
                            </div>
                        </div>
                        <div class="bg-gray-50 dark:bg-gray-700/50 rounded-lg p-4">
                            <h3 class="text-lg font-medium text-gray-900 dark:text-white mb-2">公共空间</h3>
                            <div class="text-sm text-gray-500 dark:text-gray-400 mb-2">
                                <button class="text-primary hover:underline" onclick="showPublicSpaceSettings()">
                                    查看详情
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 操作日志 -->
            <div id="logs-tab" class="tab-pane hidden">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6">
                    <h2 class="text-xl font-bold text-gray-900 dark:text-white mb-6">操作日志</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full">
                            <thead>
                                <tr class="border-b border-gray-200 dark:border-gray-700">
                                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 dark:text-gray-400">时间</th>
                                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 dark:text-gray-400">用户</th>
                                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 dark:text-gray-400">操作</th>
                                    <th class="px-4 py-3 text-left text-sm font-medium text-gray-500 dark:text-gray-400">详情</th>
                                </tr>
                            </thead>
                            <tbody id="logs-table-body">
                                <!-- 日志列表将通过JavaScript动态生成 -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- 公告管理 -->
            <div id="announcements-tab" class="tab-pane hidden">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-sm p-6">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-bold text-gray-900 dark:text-white">公告管理</h2>
                        <button class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors flex items-center gap-2" onclick="showAddAnnouncementModal()">
                            <i class="fas fa-plus"></i>
                            <span>发布公告</span>
                        </button>
                    </div>
                    <div id="announcements-list">
                        <!-- 公告列表将通过JavaScript动态生成 -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加用户弹窗 -->
    <div id="add-user-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-md w-full p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-900 dark:text-white">添加用户</h2>
                <button onclick="closeAddUserModal()" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="space-y-4">
                <form onsubmit="handleAddUser(event)">
                    <div>
                        <label for="user-password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">密码</label>
                        <input type="password" id="user-password" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:text-white transition-all">
                    </div>
                    <div>
                        <label for="user-role" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">角色</label>
                        <select id="user-role" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:text-gray-300 transition-all">
                            <option value="user">普通用户</option>
                            <option value="admin">管理员</option>
                        </select>
                    </div>
                    <div class="flex justify-end gap-3 mt-6">
                        <button type="button" onclick="closeAddUserModal()" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                            取消
                        </button>
                        <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors">
                            添加
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- 发布公告弹窗 -->
    <div id="add-announcement-modal" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50 hidden">
        <div class="bg-white dark:bg-gray-800 rounded-xl shadow-2xl max-w-2xl w-full p-6">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-xl font-bold text-gray-900 dark:text-white">发布公告</h2>
                <button onclick="closeAddAnnouncementModal()" class="text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div class="space-y-4">
                <form onsubmit="handleAddAnnouncement(event)">
                    <div>
                        <label for="announcement-title" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">标题</label>
                        <input type="text" id="announcement-title" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:text-white transition-all">
                    </div>
                    <div>
                        <label for="announcement-content" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">内容</label>
                        <textarea id="announcement-content" rows="4" required class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:text-white transition-all"></textarea>
                    </div>
                    <div>
                        <label for="announcement-expiry" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">有效期（天）</label>
                        <input type="number" id="announcement-expiry" min="1" value="7" class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:text-white transition-all">
                    </div>
                    <div class="flex justify-end gap-3 mt-6">
                        <button type="button" onclick="closeAddAnnouncementModal()" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                            取消
                        </button>
                        <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-primary/90 transition-colors">
                            发布
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="admin.js"></script>
</body>
</html>
